include:
  - playit.yml
services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: 26.2
      MEMORY: ${MC_MEMORY:-2G}
      TZ: ${TZ:-UTC}
      ONLINE_MODE: ${ONLINE_MODE:-false}
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:-changeme}
      ENABLE_RCON: "true"
      OVERRIDE_SERVER_PROPERTIES: "true"
      ALLOW_NETHER: "true"
      GENERATE_STRUCTURES: "true"
      LEVEL_TYPE: DEFAULT
      VIEW_DISTANCE: ${VIEW_DISTANCE:-8}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-6}
      MAX_PLAYERS: ${MAX_PLAYERS:-20}
      MOTD: ${MOTD:-A Minecraft Server}
      ENABLE_WHITELIST: ${ENABLE_WHITELIST:-false}   # fixed
      OPS: ${OPS:-}
      WHITELIST: ${WHITELIST:-}
      EXISTING_WHITELIST_FILE: SKIP

      # Aikar's JVM flags — reduces GC pauses significantly
      JVM_OPTS: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200
        -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC
        -XX:+AlwaysPreTouch
        -XX:G1NewSizePercent=30
        -XX:G1MaxNewSizePercent=40
        -XX:G1HeapRegionSize=8M
        -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5
        -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=15
        -XX:G1MixedGCLiveThresholdPercent=90
        -XX:G1RSetUpdatingPauseTimePercent=5
        -XX:SurvivorRatio=32
        -XX:+PerfDisableSharedMem
        -XX:MaxTenuringThreshold=1

      # Pause JVM when no players online — good for laptop hosting
      ENABLE_AUTOPAUSE: "true"
      AUTOPAUSE_TIMEOUT_EST: 3600
      AUTOPAUSE_TIMEOUT_INIT: 300
      MAX_TICK_TIME: -1

      # Mods via Modrinth — auto-downloaded and kept up to date
      MODRINTH_PROJECTS: "fabric-api,lithium?,ferrite-core,krypton,c2me-fabric:alpha,scalablelux,spark,clumps?"

    volumes:
      - ./data:/data
      - ./config:/config          # syncs into /data/config/
      - ./mods:/mods              # fixed: was /plugins
      - ./backups:/backups

  backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
      RCON_PASSWORD: ${RCON_PASSWORD:-changeme}
      GIT_AUTO_PUSH: ${GIT_AUTO_PUSH:-false}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache zstd docker-cli rcon-cli coreutils git curl && \
        while true; do
          bash /scripts/backup.sh
          sleep $${BACKUP_INTERVAL:-3600}
        done
