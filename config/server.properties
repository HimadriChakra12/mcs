# Managed by docker-compose environment variables.
# Values here are used as defaults; OVERRIDE_SERVER_PROPERTIES=true in compose
# will let env vars take precedence.
max-players=20
view-distance=10
simulation-distance=8
difficulty=normal
gamemode=survival
pvp=true
enable-command-block=false
spawn-protection=16
online-mode=false
allow-flight=false
